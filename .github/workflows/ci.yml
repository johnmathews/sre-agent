name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One repo, two images: the Python server (sre-agent, repo root) and the web UI (sre-webapp, web/).
# Each image builds and deploys only when its own files change, so a UI change does not restart the
# server (which drops /mcp for about 20 s) and a server change does not redeploy the UI. `check`
# runs on every change because the docs tests read docs/ too.
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      agent: ${{ steps.filter.outputs.agent }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Everything that ends up in, or decides, the sre-agent image.
          filters: |
            agent:
              - 'src/**'
              - 'scripts/**'
              - 'runbooks/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'

  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: make lint

      - name: Cache mypy
        uses: actions/cache@v5
        with:
          path: .mypy_cache
          key: ${{ runner.os }}-mypy-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-mypy-

      - name: Typecheck
        run: make typecheck

      - name: Test
        run: make test

  build:
    # latest is a production deploy: the home server's WUD redeploys sre-agent within a minute
    # of a new digest, so a commit that fails `check` must never publish an image.
    needs: [changes, check]
    if: github.event_name == 'push' && needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build once into the local Docker daemon and run the smoke test against it. The push step
      # below reuses the gha cache, so it only re-tags and uploads the layers built here.
      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: sre-agent:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test image
        run: scripts/smoke_image.sh sre-agent:smoke

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/johnmathews/sre-agent:latest
            ghcr.io/johnmathews/sre-agent:sha-${{ github.sha }}
          # Read by the home server's deploy notifier to name the release and list what changed.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web-test:
    name: web-test (typecheck + Playwright)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # No `vite build` here: Playwright starts its own vite dev server, so the production build
      # happens once, inside the image's builder stage.
      - name: Typecheck
        run: npm run typecheck

      - name: Get Playwright version
        id: pw
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-cw

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  web-build:
    # Same rule as `build`: WUD redeploys sre-webapp on a new :latest digest, so only a commit that
    # passed web-test may publish one.
    needs: [changes, web-test]
    if: github.event_name == 'push' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: web
          # The homelab is x86_64 only; arm64 through QEMU adds minutes for nothing deployed.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/johnmathews/sre-webapp:latest
            ghcr.io/johnmathews/sre-webapp:sha-${{ github.sha }}
          # Read by the home server's deploy notifier to name the release and list what changed.
          labels: |
            org.opencontainers.image.title=sre-webapp
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
