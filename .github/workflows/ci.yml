name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: make lint

      - name: Cache mypy
        uses: actions/cache@v5
        with:
          path: .mypy_cache
          key: ${{ runner.os }}-mypy-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-mypy-

      - name: Typecheck
        run: make typecheck

      - name: Test
        run: make test

  build:
    # latest is a production deploy: the home server's WUD redeploys sre-agent within a minute
    # of a new digest, so a commit that fails `check` must never publish an image.
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build once into the local Docker daemon and run the smoke test against it. The push step
      # below reuses the gha cache, so it only re-tags and uploads the layers built here.
      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: sre-agent:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test image
        run: scripts/smoke_image.sh sre-agent:smoke

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/johnmathews/sre-agent:latest
            ghcr.io/johnmathews/sre-agent:sha-${{ github.sha }}
          # Read by the home server's deploy notifier to name the release and list what changed.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
