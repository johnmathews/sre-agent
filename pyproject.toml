[project]
name = "homelab-sre-assistant"
version = "0.1.0"
description = "AI-powered SRE assistant for homelab infrastructure"
requires-python = ">=3.13"
dependencies = [
    "langchain>=0.3,<2",
    "langchain-chroma>=0.2,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "langchain-anthropic>=0.3,<2",
    "langchain-openai>=1.1.9,<2",
    "prometheus-client>=0.21",
    "apscheduler>=3.10,<4",
    "claude-agent-sdk>=0.1.51,<0.2",
    "fastmcp>=3.4.10,<4",
    "pyjwt[crypto]>=2.15,<3",
    "anthropic>=0.120,<1",
    "openai>=2.34,<3",
    "starlette>=1.3.1,<2",
    "langchain-core>=1.7,<2",
    "langgraph>=1.2,<2",
]

[dependency-groups]
dev = [
    "mypy>=1.0",
    "ruff>=0.9",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "respx>=0.22.0",
    "types-pyyaml>=6.0.12.20250915",
    "coverage>=7.0",
]

[tool.uv]
constraint-dependencies = ["mcp>=1.30,<2"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 91
show_missing = true
skip_covered = true

[tool.mypy]
strict = true
python_version = "3.13"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that mock external HTTP APIs (run by default)",
    "e2e: tests that hit real services and cost money (skipped by default, run with --run-e2e)",
    "real_context: upgrade review tests that read real context files (skip the _load_context stub)",
]
