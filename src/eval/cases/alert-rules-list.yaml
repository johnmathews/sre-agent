id: alert-rules-list
description: "Agent should list configured alert rules"
question: "What alert rules are configured in Grafana?"

required_services: [grafana]

expected_tools:
  must_call: [grafana_get_alert_rules]
  may_call: [grafana_get_alerts]
  must_not_call: []

mocks:
  - url: "http://grafana.test:3000/api/prometheus/grafana/api/v1/rules"
    method: GET
    status: 200
    body:
      status: "success"
      data:
        groups:
          - name: "infrastructure"
            file: "infra"
            folderUid: "infra"
            rules:
              - uid: "rule-1"
                name: "HighCPU"
                type: "alerting"
                state: "inactive"
                health: "ok"
                lastError: ""
                lastEvaluation: "2024-01-15T10:00:00Z"
                labels:
                  severity: "warning"
                annotations: {}
                alerts: []
              - uid: "rule-2"
                name: "LowDiskSpace"
                type: "alerting"
                state: "inactive"
                health: "ok"
                lastError: ""
                lastEvaluation: "2024-01-15T10:00:00Z"
                labels:
                  severity: "critical"
                annotations: {}
                alerts: []
  - url: "http://grafana.test:3000/api/alertmanager/grafana/api/v2/alerts/groups"
    method: GET
    status: 200
    body: []

rubric: |
  The answer should:
  1. List both alert rules (HighCPU and LowDiskSpace)
  2. Include severity levels
  3. Not confuse alert rules with active alerts
